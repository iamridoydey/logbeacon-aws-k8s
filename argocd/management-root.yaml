apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: management-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
    targetRevision: main
    path: argocd/management

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
