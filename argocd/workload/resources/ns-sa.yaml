apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-required-ns-sa
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: default
  source:
    repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
    targetRevision: HEAD
    path: infra-resources/ns-sa/workload
  
  destination:
    name: workload-cluster

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true