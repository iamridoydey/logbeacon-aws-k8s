apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: db-migration
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "65"

spec:
  project: default

  source:
    repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
    targetRevision: main
    path: infra-resources/external-secrets/db-migration/db-migration.yaml

  destination:
    name: workload-cluster
    namespace: logbeacon

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
