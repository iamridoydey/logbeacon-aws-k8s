apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: logbeacon-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
    targetRevision: HEAD
    path: apps/logbeacon/overlays/prod

  destination:
    name: workload-cluster
    namespace: logbeacon

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
