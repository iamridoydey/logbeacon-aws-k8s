apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: workload-argo-rollouts
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "40"

spec:
  project: default

  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: "2.43.0"

      helm:
        valueFiles:
          - $values/infra/argo-rollouts-values.yaml
          
    - repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
      targetRevision: main
      ref: values

    # ==========================================
    # Argo Rollouts additional resources
    # ==========================================
    - repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
      targetRevision: main
      path: infra-resources/argo-rollouts

  destination:
    name: workload-cluster
    namespace: argo-rollouts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true