apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sonarqube
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "45"

spec:
  project: default

  sources:
    - repoURL: https://SonarSource.github.io/helm-chart-sonarqube
      chart: sonarqube
      targetRevision: 2026.4.0

      helm:
        valueFiles:
          - $values/infra/sonarqube-values.yaml

    - repoURL: https://github.com/iamridoydey/lobeacon-aws-k8s.git
      targetRevision: main
      ref: values

  destination:
    name: workload-cluster
    namespace: sonarqube

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
