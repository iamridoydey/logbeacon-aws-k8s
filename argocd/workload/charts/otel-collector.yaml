apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "44"
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      # Chart 0.174.0 ships appVersion 0.161.0, matching image.tag in the values file.
      targetRevision: 0.174.0
      helm:
        valueFiles:
          - $values/infra/otel-collector-values.yaml
    - repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
      targetRevision: main
      ref: values
  destination:
    name: workload-cluster
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
