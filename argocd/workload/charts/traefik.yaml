apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: workload-traefik
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "30"

spec:
  project: default

  sources:
    # Gateway API experimental CRDs — must exist before Traefik's
    # kubernetesgateway provider starts watching TLSRoute/TCPRoute/UDPRoute,
    # or the provider's informer cache never finishes syncing and
    # GatewayClass/Gateway status updates freeze permanently.
    - repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      targetRevision: v1.5.1
      path: config/crd/experimental

    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 41.1.1

      helm:
        valueFiles:
          - $values/infra/traefik-values.yaml

    - repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
      targetRevision: main
      ref: values

  destination:
    name: workload-cluster
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true