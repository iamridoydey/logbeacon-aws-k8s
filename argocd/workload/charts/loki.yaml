# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "43"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.16.0
      helm:
        valueFiles:
          - $values/infra/loki-values.yaml
    - repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
      targetRevision: main
      ref: values
  destination:
    name: workload-cluster
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true