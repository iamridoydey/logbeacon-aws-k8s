apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "43"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.10.1
      helm:
        valueFiles:
          - $values/infra/tempo-values.yaml
    - repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
      targetRevision: main
      ref: values
  destination:
    name: workload-cluster
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true