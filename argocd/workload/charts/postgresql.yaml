apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: workload-postgresql
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "50"

spec:
  project: default

  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: postgresql
      targetRevision: 16.7.24

      helm:
        valueFiles:
          - $values/infra/postgres-values.yaml

    - repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
      targetRevision: main
      ref: values

  destination:
    name: workload-cluster
    namespace: logbeacon

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
