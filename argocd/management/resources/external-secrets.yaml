apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-secrets
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "15"

spec:
  project: default
  source:
    repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
    targetRevision: HEAD
    path: infra-resources/external-secrets/management

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
