apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Management cluster Helm applications
  - charts/cert-manager.yaml
  - charts/external-dns.yaml
  - charts/external-secrets.yaml
  - charts/traefik.yaml
  # Management cluster raw-resource applications
  - resources/ns-sa.yaml
  - resources/cluster-secret-store.yaml
  - resources/external-secrets.yaml
  # Image updater config to track your application image
  - resources/image-updater.yaml
  # Argo apps
  - apps/management-apps.yaml
  # Root Application for the workload cluster
  - workload-root.yaml