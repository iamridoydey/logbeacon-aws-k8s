apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Wave 0 - Namespaces and ServiceAccounts
  - resources/ns-sa.yaml

  # Wave 5 - External Secrets Operator
  - charts/external-secrets.yaml

  # Wave 10 - ClusterSecretStore
  - resources/cluster-secret-store.yaml

  # Wave 15 - ExternalSecrets
  # Creates Cloudflare, GitHub and workload EKS secrets
  - resources/external-secrets.yaml

  # Wave 20 - cert-manager controller + CRDs
  - charts/cert-manager.yaml

  # Wave 25 - cert-manager resources
  - resources/certificate.yaml

  # Wave 30 - Traefik
  - charts/traefik.yaml

  # Wave 35 - ExternalDNS
  - charts/external-dns.yaml

  # Wave 40 - Argo CD Image Updater controller + CRD
  - charts/image-updater.yaml

  # Wave 45 - ImageUpdater custom resource
  - resources/image-updater.yaml

  # Wave 50 - Management applications
  - apps/management-apps.yaml

  # Wave 55 - Bootstrap workload cluster applications
  - workload-root.yaml
