apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: management-cert-manager
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "20"

spec:
  project: default

  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.1

      helm:
        valueFiles:
          - $values/infra/cert-manager-values.yaml
    - repoURL: https://github.com/iamridoydey/logbeacon-aws-k8s.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
