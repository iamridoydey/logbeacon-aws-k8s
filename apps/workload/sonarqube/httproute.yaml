apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: sonarqube

spec:
  parentRefs:
    - name: logbeacon-gateway
      namespace: logbeacon
      sectionName: https

  hostnames:
    - sonarqube.aws-logbeacon.iamridoydey.me

  rules:
    - backendRefs:
        - name: workload-sonarqube-sonarqube
          port: 9000