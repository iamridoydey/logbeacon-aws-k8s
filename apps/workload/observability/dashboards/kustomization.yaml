apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

configMapGenerator:
  - name: logbeacon-analyze
    files:
      - logbeacon-analyze.json
    options:
      labels:
        grafana_dashboard: "1"

  - name: logbeacon-auth
    files:
      - logbeacon-auth.json
    options:
      labels:
        grafana_dashboard: "1"

  - name: logbeacon-dashboard
    files:
      - logbeacon-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"

  - name: logbeacon-logs
    files:
      - logbeacon-logs.json
    options:
      labels:
        grafana_dashboard: "1"

  - name: logbeacon-system
    files:
      - logbeacon-system.json
    options:
      labels:
        grafana_dashboard: "1"

generatorOptions:
  disableNameSuffixHash: true