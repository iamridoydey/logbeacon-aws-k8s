apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: logbeacon-tls
  namespace: logbeacon

spec:
  secretName: logbeacon-tls

  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer

  dnsNames:
    - qa.aws-logbeacon.iamridoydey.me
    - api.qa.aws-logbeacon.iamridoydey.me