apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: logbeacon-backend
  namespace: logbeacon

spec:
  replicas: 3

  strategy:
    canary:
      canaryService: logbeacon-backend-canary
      stableService: logbeacon-backend-stable
      dynamicStableScale: true

      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: logbeacon-backend
            namespace: logbeacon

      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 50
        - pause:
            duration: 30s

  selector:
    matchLabels:
      app: logbeacon-backend

  template:
    metadata:
      labels:
        app: logbeacon-backend

    spec:
      serviceAccountName: logbeacon

      containers:
        - name: backend
          image: logbeacon/backend

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: logbeacon-backend-config

            - secretRef:
                name: logbeacon-app-secret

          env:
            # Explicitly define these so they can be used
            # when constructing DATABASE_URL.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: logbeacon-app-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logbeacon-app-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: logbeacon-app-secret
                  key: POSTGRES_DB

            - name: POSTGRES_HOST
              value: "workload-postgresql"

            - name: POSTGRES_PORT
              value: "5432"

            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

            - name: REDIS_URL
              value: "redis://workload-redis-master:6379/0"

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20