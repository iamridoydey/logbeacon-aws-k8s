apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: github-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: github-secret
        property: USERNAME
    - secretKey: password
      remoteRef:
        key: github-secret
        property: TOKEN