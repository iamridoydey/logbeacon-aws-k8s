apiVersion: batch/v1
kind: Job
metadata:
  name: sonarqube-bootstrap
  namespace: sonarqube
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: sonarqube-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: sonarqube
      containers:
        - name: bootstrap
          image: amazon/aws-cli:2.27.54
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: SONAR_HOST_URL
              value: "https://sonarqube.aws-logbeacon.iamridoydey.me"
            - name: ADMIN_SECRET_NAME
              value: "logbeacon/sonarqube-admin-password"
            - name: CI_SECRET_NAME
              value: "sonarqube-ci-cred"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              # Install curl if missing
              if ! command -v curl >/dev/null 2>&1; then
                yum install -y curl || apk add --no-cache curl
              fi

              echo "Waiting for SonarQube..."
              until curl -sf "${SONAR_HOST_URL}/api/system/status" | grep -q '"status":"UP"'; do
                echo "SonarQube is not ready yet..."
                sleep 10
              done
              echo "SonarQube is ready."

              # Fetch admin password
              ADMIN_SECRET="$(aws secretsmanager get-secret-value \
                --secret-id "${ADMIN_SECRET_NAME}" \
                --query 'SecretString' \
                --output text)"
              ADMIN_PASSWORD="$(echo "${ADMIN_SECRET}" | sed -n 's/.*"ADMIN_PASSWORD":"\([^"]*\)".*/\1/p')"

              if [ -z "${ADMIN_PASSWORD}" ]; then
                echo "ERROR: ADMIN_PASSWORD not found in ${ADMIN_SECRET_NAME}." >&2
                exit 1
              fi

              # Verify admin password works (Helm setAdminPassword should have already set it)
              if ! curl -sf -u "admin:${ADMIN_PASSWORD}" \
                "${SONAR_HOST_URL}/api/authentication/validate" | grep -q '"valid":true'; then
                echo "ERROR: Admin authentication failed. Check Helm setAdminPassword hook." >&2
                exit 1
              fi
              echo "Admin credentials verified."

              # Check if CI token already exists
              CI_SECRET="$(aws secretsmanager get-secret-value \
                --secret-id "${CI_SECRET_NAME}" \
                --query 'SecretString' \
                --output text 2>/dev/null || echo '{}')"

              if echo "${CI_SECRET}" | grep -q '"SONAR_TOKEN"'; then
                TOKEN_VALUE="$(echo "${CI_SECRET}" | sed -n 's/.*"SONAR_TOKEN":"\([^"]*\)".*/\1/p')"
                if [ -n "${TOKEN_VALUE}" ]; then
                  echo "SonarQube CI token already exists. Nothing to do."
                  exit 0
                fi
              fi

              # Revoke any stale token
              echo "Revoking any pre-existing token named logbeacon-ci-cred..."
              curl -sf -u "admin:${ADMIN_PASSWORD}" -X POST \
                --data-urlencode "name=logbeacon-ci-cred" \
                "${SONAR_HOST_URL}/api/user_tokens/revoke" || true

              # Generate new CI token
              echo "Generating SonarQube CI token..."
              RESPONSE="$(curl -sf -u "admin:${ADMIN_PASSWORD}" -X POST \
                --data-urlencode "name=logbeacon-ci-cred" \
                "${SONAR_HOST_URL}/api/user_tokens/generate")"

              TOKEN="$(echo "${RESPONSE}" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
              if [ -z "${TOKEN}" ]; then
                echo "ERROR: Token generation failed." >&2
                exit 1
              fi
              echo "CI token generated."

              # Store in Secrets Manager
              SECRET_STRING="$(printf '{"SONAR_HOST_URL":"%s","SONAR_TOKEN":"%s"}' \
                "${SONAR_HOST_URL}" "${TOKEN}")"

              echo "Updating ${CI_SECRET_NAME}..."
              aws secretsmanager put-secret-value \
                --secret-id "${CI_SECRET_NAME}" \
                --secret-string "${SECRET_STRING}" >/dev/null

              echo "SonarQube CI token bootstrap completed."
