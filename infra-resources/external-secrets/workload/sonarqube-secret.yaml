apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-admin-password
  namespace: sonarqube
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: sonarqube-admin-password
    creationPolicy: Owner
    template:
      data:
        password: "{{ .password }}"      # new admin password, taken from Secrets Manager
        currentPassword: "admin"         # SonarQube's default password on first boot
  data:
    - secretKey: password
      remoteRef:
        key: logbeacon/sonarqube-admin-password
        property: ADMIN_PASSWORD