apiVersion: batch/v1
kind: Job
metadata:
  name: sonarqube-bootstrap
  namespace: sonarqube
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 900   # hard ceiling — don't let a stuck job run forever

  template:
    metadata:
      labels:
        app: sonarqube-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: sonarqube-bootstrap

      containers:
        - name: bootstrap
          image: amazon/aws-cli:2.27.54

          env:
            - name: SONAR_HOST_URL
              value: "https://sonarqube.aws-logbeacon.iamridoydey.me"
            - name: ADMIN_SECRET_NAME
              value: "sonarqube-admin-password"
            - name: CI_SECRET_NAME
              value: "sonarqube-ci-cred"

          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 250m, memory: 256Mi }

          command:
            - /bin/sh
            - -c
            - |
              set -eu

              echo "Waiting for SonarQube..."
              until curl -sf "${SONAR_HOST_URL}/api/system/status" | grep -q '"status":"UP"'; do
                echo "Not ready yet..."
                sleep 10
              done
              echo "SonarQube is ready."

              # ---- Fetch the target admin password (source of truth in AWS) ----
              ADMIN_PASSWORD="$(aws secretsmanager get-secret-value \
                --secret-id "${ADMIN_SECRET_NAME}" \
                --query SecretString --output text | \
                sed -n 's/.*"ADMIN_PASSWORD":"\([^"]*\)".*/\1/p')"

              # ---- Detect current live password state, rotate only if needed ----
              if curl -sf -u "admin:${ADMIN_PASSWORD}" "${SONAR_HOST_URL}/api/system/status" >/dev/null 2>&1; then
                echo "Admin password already matches target. No rotation needed."
              elif curl -sf -u "admin:admin" "${SONAR_HOST_URL}/api/system/status" >/dev/null 2>&1; then
                echo "Still on factory default. Rotating..."
                curl -sf -u "admin:admin" -X POST \
                  --data-urlencode "login=admin" \
                  --data-urlencode "previousPassword=admin" \
                  --data-urlencode "password=${ADMIN_PASSWORD}" \
                  "${SONAR_HOST_URL}/api/users/change_password"
                echo "Rotation complete."
              else
                echo "ERROR: admin auth failed with both target and default password." >&2
                exit 1
              fi

              # ---- Token idempotency check ----
              echo "Checking for existing CI token..."
              if aws secretsmanager get-secret-value --secret-id "${CI_SECRET_NAME}" >/dev/null 2>&1; then
                EXISTING="$(aws secretsmanager get-secret-value --secret-id "${CI_SECRET_NAME}" --query SecretString --output text)"
                if echo "${EXISTING}" | grep -q '"SONAR_TOKEN"'; then
                  echo "Token already exists. Nothing to do."
                  exit 0
                fi
              fi

              echo "Generating CI token..."
              RESPONSE="$(curl -sf -u "admin:${ADMIN_PASSWORD}" -X POST \
                --data-urlencode "name=logbeacon-cred" \
                "${SONAR_HOST_URL}/api/user_tokens/generate")"
              TOKEN="$(echo "${RESPONSE}" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"

              if [ -z "${TOKEN}" ]; then
                echo "ERROR: token generation failed." >&2
                exit 1
              fi

              SECRET_STRING="$(printf '{"SONAR_HOST_URL":"%s","SONAR_TOKEN":"%s"}' "${SONAR_HOST_URL}" "${TOKEN}")"

              if aws secretsmanager get-secret-value --secret-id "${CI_SECRET_NAME}" >/dev/null 2>&1; then
                aws secretsmanager put-secret-value --secret-id "${CI_SECRET_NAME}" --secret-string "${SECRET_STRING}"
              else
                aws secretsmanager create-secret --name "${CI_SECRET_NAME}" \
                  --description "LogBeacon SonarQube CI credentials" \
                  --secret-string "${SECRET_STRING}"
              fi

              echo "Done."