mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib
  # Matches chart 0.174.0 (appVersion 0.161.0)
  tag: "0.161.0"

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    prometheus:
      config:
        scrape_configs:
          - job_name: postgresql
            scrape_interval: 15s
            static_configs:
              - targets: ["postgres-exporter.logbeacon.svc.cluster.local:9187"]
          - job_name: redis
            scrape_interval: 15s
            static_configs:
              - targets: ["redis-exporter.logbeacon.svc.cluster.local:9121"]

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 192
      spike_limit_mib: 48
    batch:
      timeout: 5s
      send_batch_size: 1024

  exporters:
    otlp/tempo:
      endpoint: workload-tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: http://workload-loki.monitoring.svc.cluster.local:3100/otlp
    prometheus:
      endpoint: 0.0.0.0:8889

  service:
    telemetry:
      metrics:
        level: basic
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki]
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, batch]
        exporters: [prometheus]
