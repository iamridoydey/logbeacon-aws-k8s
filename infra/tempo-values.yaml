tempo:
  repository: grafana/tempo
  tag: "2.10.8"
  retention: 72h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

persistence:
  enabled: true
  storageClassName: ebs-gp3
  size: 10Gi

# Fix the permission issue
securityContext:
  fsGroup: 10001
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true

podSecurityContext:
  fsGroup: 10001
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true

# Optional but recommended: init container to fix permissions
extraInitContainers:
  - name: chown-data
    image: busybox:1.36
    command:
      - chown
      - -R
      - "10001:10001"
      - /var/tempo
    volumeMounts:
      - name: storage
        mountPath: /var/tempo
    securityContext:
      runAsUser: 0

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi